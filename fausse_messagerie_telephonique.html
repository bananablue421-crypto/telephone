<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>iPhone Messagerie</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .phone {
      width: 320px;
      height: 640px;
      background: black;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      position: relative;
      color: white;
    }

    .lockscreen, .messages {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    .lockscreen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(#111, #333);
    }

    .hidden {
      display: none;
    }

    .code-display {
      font-size: 28px;
      letter-spacing: 10px;
      margin-bottom: 20px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      gap: 10px;
    }

    .key {
      background: #444;
      border-radius: 50%;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      cursor: pointer;
    }

    .messages {
      background: #111;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    audio {
      width: 100%;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<div class="phone">

  <!-- LOCKSCREEN -->
  <div class="lockscreen" id="lockscreen">
    <div class="code-display" id="display">____</div>

    <div class="keypad">
      <div class="key" onclick="press(1)">1</div>
      <div class="key" onclick="press(2)">2</div>
      <div class="key" onclick="press(3)">3</div>
      <div class="key" onclick="press(4)">4</div>
      <div class="key" onclick="press(5)">5</div>
      <div class="key" onclick="press(6)">6</div>
      <div class="key" onclick="press(7)">7</div>
      <div class="key" onclick="press(8)">8</div>
      <div class="key" onclick="press(9)">9</div>
      <div></div>
      <div class="key" onclick="press(0)">0</div>
      <div class="key" onclick="reset()">⌫</div>
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="messages hidden" id="messages">
    <h3>📞 Messagerie</h3>

    <div class="message">
      Message 1
      <audio controls src="audio1.mp3"></audio>
    </div>

    <div class="message">
      Message 2
      <audio controls src="audio2.mp3"></audio>
    </div>

    <div class="message">
      Message 3
      <audio controls src="audio3.mp3"></audio>
    </div>

    <div class="message">
      Message 4
      <audio controls src="audio4.mp3"></audio>
    </div>

    <div class="message">
      Message 5
      <audio controls src="audio5.mp3"></audio>
    </div>

    <div class="message">
      Message 6
      <audio controls src="audio6.mp3"></audio>
    </div>

  </div>

</div>

<script>
  let input = "";
  const correctCode = "1234"; // 🔥 CHANGE ICI

  function press(num) {
    if (input.length < 4) {
      input += num;
      updateDisplay();
    }

    if (input.length === 4) {
      if (input === correctCode) {
        unlock();
      } else {
        input = "";
        updateDisplay();
        alert("Code incorrect");
      }
    }
  }

  function reset() {
    input = "";
    updateDisplay();
  }

  function updateDisplay() {
    document.getElementById("display").textContent = input.padEnd(4, "_");
  }

  function unlock() {
    document.getElementById("lockscreen").classList.add("hidden");
    document.getElementById("messages").classList.remove("hidden");
  }
</script>

</body>
</html>
